name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests and a build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The payloads the tests replay live in the contract repository and are never copied into this
      # one; without them those tests skip themselves.
      - uses: actions/checkout@v4
        with:
          repository: juev/hermes
          path: hermes-contract

      - name: Toolchain
        run: |
          brew install xcodegen
          xcodebuild -version
          swift --version

      - name: Tests
        env:
          HERMES_CONTRACT_FIXTURES: ${{ github.workspace }}/hermes-contract/docs/fixtures
        run: scripts/test.sh

      - name: The app
        run: scripts/build.sh

      # The build that failed at launch once: a debug split dylib and a hardened runtime that
      # refused to load it. A binary that does not stay up is caught here, not by a person.
      - name: The app starts
        run: |
          app="build/Build/Products/Debug/Hermes.app"
          "$app/Contents/MacOS/Hermes" > /tmp/launch.log 2>&1 &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "the app is running"
            kill "$pid"
          else
            echo "the app did not stay up:"
            cat /tmp/launch.log
            exit 1
          fi
