name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: a disk image for the tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          brew install xcodegen
          xcodebuild -version
          swift --version

      - name: Build
        run: scripts/build.sh

      # The identity is this project's own: a self-signed certificate kept in the repository's secrets,
      # so every release is signed by the same name. Notarization would need an Apple Developer ID,
      # which this does not replace — it makes the artifact verifiable, not trusted by Gatekeeper.
      - name: Sign, when there is an identity
        env:
          CERTIFICATE: ${{ secrets.HERMES_MACOS_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.HERMES_MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.HERMES_MACOS_IDENTITY }}
        if: env.CERTIFICATE != ''
        run: |
          echo "$CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security unlock-keychain -p actions build.keychain
          security list-keychains -d user -s build.keychain
          security import certificate.p12 -k build.keychain -P "$PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          codesign --force --deep --options runtime --keychain build.keychain \
            --sign "$IDENTITY" build/Build/Products/Debug/Hermes.app
          codesign -dv --verbose=2 build/Build/Products/Debug/Hermes.app 2>&1 | head -8
          echo "SIGNED_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Disk image
        id: dmg
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then version="0.0.0"; fi
          name="Hermes-$version.dmg"
          hdiutil create -volname Hermes -srcfolder build/Build/Products/Debug/Hermes.app \
            -ov -format UDZO "build/$name"
          if [ -n "${SIGNED_IDENTITY:-}" ]; then
            codesign --force --keychain build.keychain --sign "$SIGNED_IDENTITY" "build/$name" || true
          fi
          shasum -a 256 "build/$name" | tee "build/$name.sha256"
          echo "path=build/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          name: Hermes ${{ steps.dmg.outputs.version }}
          body: |
            Hermes ${{ steps.dmg.outputs.version }} for macOS 15 and later.

            **The image is signed with the project's own identity and is not notarized.** It is not
            signed by Apple, so the first launch asks for permission in System Settings → Privacy &
            Security → *Open Anyway*, or the quarantine flag can be dropped first:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Hermes.app
            ```

            Checksums are in the `.sha256` file next to the image.
          fail_on_unmatched_files: true
          generate_release_notes: true
