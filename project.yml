name: Hermes

options:
  bundleIdPrefix: org.evsyukov.hermes
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

packages:
  HermesCore:
    path: Core

targets:
  Hermes:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Hermes.entitlements
    dependencies:
      - package: HermesCore
        product: HermesCore
      - package: HermesCore
        product: HermesUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.evsyukov.hermes.macos
        PRODUCT_NAME: Hermes
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Hermes.entitlements
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Hermes:
    build:
      targets:
        Hermes: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
